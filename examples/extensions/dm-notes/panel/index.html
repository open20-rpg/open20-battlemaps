<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <p id="count">…</p>
    <button id="refresh">Actualizar</button>
    <script>
      // A sandboxed page: it only talks to its extension, through postMessage.
      window.addEventListener("message", (e) => {
        if (e.data && e.data.notes !== undefined) document.getElementById("count").textContent = e.data.notes + " notas"
      })
      document.getElementById("refresh").onclick = () => parent.postMessage({ refresh: true }, "*")
    </script>
  </body>
</html>
