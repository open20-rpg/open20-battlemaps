name: "release"

# Releases are automated on every push to `main` with the shared Open20 release
# actions (https://github.com/open20-rpg/open20-release):
#   1. `release` reads the Conventional Commits since the last tag and, if any
#      is visible to users, publishes a version: it bumps the 5 version files
#      (scripts/bump-version.mjs and package.json), commits them back as
#      `chore(release): vX.Y.Z [skip ci]`, tags `vX.Y.Z` and creates the GitHub
#      Release with the notes. Pushes with nothing releasable build nothing.
#   2. `announce` posts the version on Discord, saying the downloads are being
#      prepared.
#   3. The build jobs compile Windows, Linux, macOS (Intel + Apple Silicon) and
#      Android from that tag and attach the installers to it. As soon as each
#      one is done it also uploads a copy with a fixed name
#      (Open20-Battle-Maps-windows-setup.exe, …), so
#      https://github.com/<repo>/releases/latest/download/<name> points at the
#      newest version (that's what open20.app and the README link to), and
#      reacts to the announcement with its platform's emoji. Releases are not
#      marked prerelease, or "latest" would skip them.
#   4. `finish-announcement` drops the "being prepared" line once every build
#      has finished, also when one failed (macOS often fails on GitHub's side).
#
# To rebuild the installers of an existing release (e.g. after a failed or
# cancelled build), run this workflow by hand with `rebuild` set to its
# version: the rebuilt platforms react to its existing announcement.
#
# Discord uses the organization's DISCORD_BOT_TOKEN secret; without it nothing
# is announced and the release goes on.
#
# Android signing (optional). To produce a *signed*, installable APK/AAB, set these
# repository secrets. Without them the Android job still runs but only uploads an
# UNSIGNED apk as a workflow artifact (which cannot be installed as-is), and
# Android gets no download:
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks keystore   (base64 -w0 key.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the installers of an existing release (version, e.g. 0.3.22) instead of releasing"
        required: false
        default: ""
  push:
    branches: [main]

# Allow the jobs to create/update the release and push the version commit.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two releases at once (they'd race for the same version).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: inputs.rebuild == '' || inputs.rebuild == null
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: open20-rpg/open20-release/release@v1
        id: release
        with:
          npm: "true"
          prepare: node scripts/bump-version.mjs ${nextRelease.version}
          commit-assets: |
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock

  announce:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      # For the banner's background and icon.
      - uses: actions/checkout@v7

      - uses: open20-rpg/open20-release/discord-announce@v1
        with:
          tag: v${{ needs.release.outputs.version }}
          title: Open20 Battle Maps
          download: https://open20.app/battle-maps
          status: "⏳ Preparando las descargas, puede tardar unos minutos."
          banner-background: .github/discord-banner.jpg
          banner-icon: src/assets/brand/battle-maps-icon.svg
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

  # ---------------------------------------------------------------------------
  # Desktop: Windows, Linux, macOS (arm64 + x86_64) via tauri-action.
  # ---------------------------------------------------------------------------
  desktop:
    needs: [release, announce]
    if: ${{ !cancelled() && (needs.release.outputs.version != '' || inputs.rebuild != '') }}
    strategy:
      fail-fast: false
      matrix:
        # asset: the installer behind the fixed-name download (a regex of its
        # release file name); emoji: its reaction on the announcement.
        include:
          - platform: "macos-latest" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
            asset: '_aarch64\.dmg$'
            alias: Open20-Battle-Maps-macos-apple-silicon.dmg
            emoji: macos_silicon_ready
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
            asset: '_x64\.dmg$'
            alias: Open20-Battle-Maps-macos-intel.dmg
            emoji: macos_intel_ready
          - platform: "ubuntu-22.04"
            args: ""
            asset: '_amd64\.AppImage$'
            alias: Open20-Battle-Maps-linux.AppImage
            emoji: linux_ready
          - platform: "windows-latest"
            args: ""
            asset: '_x64-setup\.exe$'
            alias: Open20-Battle-Maps-windows-setup.exe
            emoji: windows_ready

    runs-on: ${{ matrix.platform }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ inputs.rebuild || needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.rebuild || needs.release.outputs.version }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only needed on macOS runners; kept in an `if` expression to slightly
          # speed up Windows/Linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config

      - name: install frontend dependencies
        run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        # On macOS runners bundle_dmg.sh's `hdiutil create` fails at random
        # with "Resource busy" (the volume is still held by a background
        # scan), so macOS gets one retry below; elsewhere a failure fails the
        # job as usual.
        continue-on-error: ${{ matrix.platform == 'macos-latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The release already exists (semantic-release made it, with its
          # notes); tauri-action only uploads the installers to it.
          tagName: v${{ inputs.rebuild || needs.release.outputs.version }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Retry after a macOS failure: the Rust build is already in target/, so
      # this only re-runs the bundling. A second failure fails the job.
      - name: retry tauri build (macOS only)
        if: matrix.platform == 'macos-latest' && steps.tauri.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ inputs.rebuild || needs.release.outputs.version }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The fixed-name copy goes up as soon as this build is done, so its
      # download works without waiting for the other platforms.
      - name: upload fixed-name copy
        shell: bash
        run: |
          f=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -E '${{ matrix.asset }}' | grep -v '^Open20-Battle-Maps-' | head -1)
          if [ -z "$f" ]; then echo "::error::no release file matches ${{ matrix.asset }}"; exit 1; fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$f" -D dl --clobber
          cp "dl/$f" "${{ matrix.alias }}"
          gh release upload "$TAG" "${{ matrix.alias }}" -R "$GITHUB_REPOSITORY" --clobber

      - uses: open20-rpg/open20-release/discord-react@v1
        with:
          tag: ${{ env.TAG }}
          emoji: ${{ matrix.emoji }}
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

  # ---------------------------------------------------------------------------
  # Android: builds the app bundle / apk. Signs it when keystore secrets exist.
  # ---------------------------------------------------------------------------
  android:
    needs: [release, announce]
    # Runs after a new release, or on its own to rebuild an existing one.
    if: ${{ !cancelled() && (needs.release.outputs.version != '' || inputs.rebuild != '') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ inputs.rebuild || needs.release.outputs.version }}
      NDK_VERSION: "27.3.13750724" # NDK r27 LTS (Google's recommended)
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.rebuild || needs.release.outputs.version }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: setup Android SDK
        uses: android-actions/setup-android@v4

      - name: cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: install Android NDK
        # On a cache hit sdkmanager detects the NDK is already present and skips
        # the ~600MB download; on a miss it installs and the cache step saves it.
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci --ignore-scripts

      # The Android project (src-tauri/gen/android) is committed and already wired
      # for release signing, so CI only needs to drop the keystore + credentials
      # that keystore.properties (git-ignored) references.
      - name: setup Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd src-tauri/gen/android
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/keystore.jks"

      - name: build Android (signed)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: npm run tauri android build -- --apk --aab

      - name: build Android (unsigned apk)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: npm run tauri android build -- --apk

      # Only the final outputs (Gradle also leaves an intermediary-bundle.aab).
      - name: collect artifacts
        run: |
          mkdir -p android-artifacts
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} android-artifacts/ \;
          ls -la android-artifacts

      # A convenience copy on the run page: GitHub's artifact service failing
      # must not stop the build from reaching the release.
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: android
          path: android-artifacts/*

      - name: attach to release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.rebuild || needs.release.outputs.version }}
          prerelease: false
          files: android-artifacts/*

      # Only a signed build reaches the release, and so the download.
      - name: upload fixed-name copy
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cp "$(ls android-artifacts/*universal*.apk | head -1)" Open20-Battle-Maps-android.apk
          gh release upload "$TAG" Open20-Battle-Maps-android.apk -R "$GITHUB_REPOSITORY" --clobber

      - uses: open20-rpg/open20-release/discord-react@v1
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          tag: ${{ env.TAG }}
          emoji: android_ready
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}

  # ---------------------------------------------------------------------------
  # Once every build has finished, successfully or not, the announcement drops
  # its "being prepared" line. A platform without its emoji failed: rebuilding
  # it adds the emoji later.
  # ---------------------------------------------------------------------------
  finish-announcement:
    needs: [release, desktop, android]
    if: ${{ !cancelled() && (needs.release.outputs.version != '' || inputs.rebuild != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: open20-rpg/open20-release/discord-finish@v1
        with:
          tag: v${{ inputs.rebuild || needs.release.outputs.version }}
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
