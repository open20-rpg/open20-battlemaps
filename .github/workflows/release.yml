name: "release"

# Releases are automated with semantic-release on every push to `main`:
#   1. `release` reads the Conventional Commits since the last tag, decides the
#      next version (feat/fix/perf -> patch, breaking -> minor while in 0.x; see
#      .releaserc.json), bumps the 5 version files, commits them back as
#      `chore(release): vX.Y.Z [skip ci]`, tags `vX.Y.Z` and creates the GitHub
#      Release (marked prerelease until 1.0).
#   2. Only when a release was published, the build jobs compile Windows, Linux,
#      macOS (Intel + Apple Silicon) and Android from that tag and attach the
#      installers to it. Pushes with nothing releasable (docs, chore, ci…) build
#      nothing.
#
# To rebuild the installers of an existing release (e.g. after a failed or
# cancelled build), run this workflow by hand with `rebuild` set to its version.
#
# semantic-release runs through `npx` with pinned versions instead of being a
# devDependency: it bundles its own npm, whose dependencies trip `npm audit`.
#
# Android signing (optional). To produce a *signed*, installable APK/AAB, set these
# repository secrets. Without them the Android job still runs but only uploads an
# UNSIGNED apk as a workflow artifact (which cannot be installed as-is):
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks keystore   (base64 -w0 key.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the installers of an existing release (version, e.g. 0.3.22) instead of releasing"
        required: false
        default: ""
  push:
    branches: [main]

# Allow the jobs to create/update the release and push the version commit.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two releases at once (they'd race for the same version).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # semantic-release: version, tag and GitHub Release from the commit history.
  # ---------------------------------------------------------------------------
  release:
    if: inputs.rebuild == '' || inputs.rebuild == null
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release

      # Every release is a prerelease until 1.0 (see AGENTS.md → Release).
      - name: mark as prerelease
        if: steps.semrel.outputs.version != '' && startsWith(steps.semrel.outputs.version, '0.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.semrel.outputs.version }}" --prerelease

  # ---------------------------------------------------------------------------
  # Desktop: Windows, Linux, macOS (arm64 + x86_64) via tauri-action.
  # Temporarily disabled to save CI minutes — only Android builds for now.
  # Re-enable by removing the `false &&` from its `if` below.
  # ---------------------------------------------------------------------------
  desktop:
    needs: release
    if: false && !cancelled() && (needs.release.outputs.version != '' || inputs.rebuild != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.rebuild || needs.release.outputs.version }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only needed on macOS runners; kept in an `if` expression to slightly
          # speed up Windows/Linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config

      - name: install frontend dependencies
        run: npm ci --ignore-scripts

      # The built-in asset pack is generated, not committed; build.rs embeds it.
      - name: built-in pack
        uses: ./.github/actions/builtin-pack

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The release already exists (semantic-release made it, with its
          # notes); tauri-action only uploads the installers to it.
          tagName: v${{ inputs.rebuild || needs.release.outputs.version }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # Android: builds the app bundle / apk. Signs it when keystore secrets exist.
  # ---------------------------------------------------------------------------
  android:
    needs: release
    # Runs after a new release, or on its own to rebuild an existing one.
    if: ${{ !cancelled() && (needs.release.outputs.version != '' || inputs.rebuild != '') }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.3.13750724" # NDK r27 LTS (Google's recommended)
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.rebuild || needs.release.outputs.version }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: setup Android SDK
        uses: android-actions/setup-android@v4

      - name: cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: install Android NDK
        # On a cache hit sdkmanager detects the NDK is already present and skips
        # the ~600MB download; on a miss it installs and the cache step saves it.
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci --ignore-scripts

      # The built-in asset pack is generated, not committed; build.rs embeds it.
      - name: built-in pack
        uses: ./.github/actions/builtin-pack

      # The Android project (src-tauri/gen/android) is committed and already wired
      # for release signing, so CI only needs to drop the keystore + credentials
      # that keystore.properties (git-ignored) references.
      - name: setup Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd src-tauri/gen/android
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/keystore.jks"

      - name: build Android (signed)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: npm run tauri android build -- --apk --aab

      - name: build Android (unsigned apk)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: npm run tauri android build -- --apk

      # Only the final outputs (Gradle also leaves an intermediary-bundle.aab).
      - name: collect artifacts
        run: |
          mkdir -p android-artifacts
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} android-artifacts/ \;
          ls -la android-artifacts

      # A convenience copy on the run page: GitHub's artifact service failing
      # must not stop the build from reaching the release.
      - name: upload artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: android
          path: android-artifacts/*

      - name: attach to release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.rebuild || needs.release.outputs.version }}
          prerelease: true
          files: android-artifacts/*
