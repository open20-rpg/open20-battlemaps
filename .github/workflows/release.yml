name: "release"

# Builds OpenDraft for Windows, Linux, macOS (Intel + Apple Silicon) and Android,
# and attaches the installers to a (draft) GitHub Release.
#
# Triggers:
#   - Manually from the Actions tab (workflow_dispatch).
#   - Automatically when a tag like `v1.2.3` is pushed.
#
# Android signing (optional). To produce a *signed*, installable APK/AAB, set these
# repository secrets. Without them the Android job still runs but only uploads an
# UNSIGNED apk as a workflow artifact (which cannot be installed as-is):
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks keystore   (base64 -w0 key.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Allow the jobs to create/update the release.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Desktop: Windows, Linux, macOS (arm64 + x86_64) via tauri-action.
  # ---------------------------------------------------------------------------
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only needed on macOS runners; kept in an `if` expression to slightly
          # speed up Windows/Linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # tauri-action replaces __VERSION__ with the app version.
          releaseName: "OpenDraft v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # Android: builds the app bundle / apk. Signs it when keystore secrets exist.
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.3.13750724" # NDK r27 LTS (Google's recommended)
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install Android NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      # The Android project (src-tauri/gen/android) is committed and already wired
      # for release signing, so CI only needs to drop the keystore + credentials
      # that keystore.properties (git-ignored) references.
      - name: setup Android signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd src-tauri/gen/android
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/keystore.jks"

      - name: build Android (signed)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: npm run tauri android build -- --apk --aab

      - name: build Android (unsigned apk)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: npm run tauri android build -- --apk

      - name: collect artifacts
        run: |
          mkdir -p android-artifacts
          find src-tauri/gen/android -type f \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} android-artifacts/ \;
          ls -la android-artifacts

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android-artifacts/*

      - name: attach to release
        if: env.ANDROID_KEYSTORE_BASE64 != '' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: android-artifacts/*
