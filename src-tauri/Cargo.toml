[package]
name = "opendraft"
version = "0.1.24"
description = "OpenDraft - open source RPG map designer"
authors = ["Pablo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opendraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
json5 = "1"
md5 = "0.8"
# Colorable-asset recoloring (decode/recolor/encode PNG on the fly).
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
urlencoding = "2"
fontdb = "0.24"

# Android needs JNI to resolve `content://` picker URIs to a file descriptor
# (the Storage Access Framework gives no real filesystem path).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

